apiVersion: v1
kind: ServiceAccount
metadata:
  name: entwickler
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notesapp-nutzer
  namespace: app
rules:
  - apiGroups: ["lab.example.com"]
    resources: ["notesapps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: entwickler-notesapp
  namespace: app
subjects:
  - kind: ServiceAccount
    name: entwickler
    namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: notesapp-nutzer
